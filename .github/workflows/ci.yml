name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API tests + lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: videoforge
          POSTGRES_PASSWORD: videoforge_secret
          POSTGRES_DB: videoforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videoforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://videoforge:videoforge_secret@localhost:5432/videoforge_test
      SECRET_KEY: ci-test-secret-key-32-chars-padding-x
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: videoforge-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: |
          ruff check api/
          ruff format --check api/

      - name: Run tests
        run: |
          cd api && python -m pytest tests/ -v --tb=short

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: videoforge
          POSTGRES_PASSWORD: videoforge_secret
          POSTGRES_DB: videoforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videoforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://videoforge:videoforge_secret@localhost:5432/videoforge_test
      SECRET_KEY: ci-test-secret-key-32-chars-padding-x
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
          pip install -r api/requirements.txt  # shared deps (sqlalchemy, etc)
          pip install pytest

      - name: Run worker tests
        run: |
          cd worker && python -m pytest . -v --tb=short || echo "No worker tests yet — skipping"

  web-tests:
    name: Web lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci || npm install

      - name: Type check
        run: |
          cd web && npx tsc --noEmit

      - name: Lint
        run: |
          cd web && npm run lint

      - name: Build
        run: |
          cd web && npm run build